<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đài Thiên Văn Dệt Chòm Sao - Celestial Constellation Weaver</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #030308;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      #celestial-canvas-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
      #celestial-ui {
        position: absolute;
        inset: 0;
        z-index: 10;
        pointer-events: none;
      }
      .interactive {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="celestial-canvas-container"></div>
    <div id="celestial-ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
